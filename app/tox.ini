[tox]
minversion = 3.8
isolated_build = True
envlist = py311, lint
envlist = py311, lint, e2e

[testenv]
description = Run the test suite with pytest
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest

# Environment variables for testing
# We override the database to use a local SQLite DB for test isolation.
setenv =
    DATABASE_URL = sqlite:///./test.db
    INFLUXDB_URL = http://localhost:8086
    INFLUXDB_TOKEN = fake-token
    INFLUXDB_ORG = test-org
    INFLUXDB_BUCKET = test-bucket

[testenv:lint]
description = Run linters
deps = flake8
commands =
    flake8 src tests

[testenv:py310]
description = run tests
deps =
    .[test]

changedir = {toxinidir}
setenv =
    PYTHONPATH = {toxinidir}/app/main/python{:}\
                 {toxinidir}/app/test/python{:}

allowlist_externals= py.test
commands =
    py.test --cov=app/main/python --cov-report=term-missing app/test/python



[testenv:e2e]
description = Run end-to-end tests with behave
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    behave features
setenv = {[testenv]setenv}


testenv:bandit]
description = run bandit
deps =
    bandit
commands =
    bandit -rv app/main/python
