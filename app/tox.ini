[tox]
minversion = 3.8
isolated_build = True
envlist = py310 #lint, bandit, e2e

[testenv]
description = Run the test suite with pytest
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest {posargs}

# Environment variables for testing
# We override the database to use a local SQLite DB for test isolation.
setenv =
    DATABASE_URL = sqlite:///./test.db
    INFLUXDB_URL = http://localhost:8086
    INFLUXDB_TOKEN = fake-token
    INFLUXDB_ORG = test-org
    INFLUXDB_BUCKET = test-bucket

; [testenv:lint]
; description = Run linters
; deps = flake8
; commands = # Run flake8 against the main application and test code
;     flake8 main/python tests


; [testenv:e2e]
; description = Run end-to-end tests with behave
; deps =
;     -r requirements.txt
;     -r requirements-dev.txt
; commands =
;     behave features
; setenv = {[testenv]setenv}


; [testenv:bandit]
; description = run bandit
; deps =
;     bandit
; commands =
;     bandit -rv main/python
