services:
  postgres:
    image: postgres:14-alpine
    container_name: cryptomug_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cryptomug_db
    volumes:
      # This mounts the 'data/db' folder on your host to the container's data directory.
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose port for local debugging if needed.
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    container_name: cryptomug_influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123 # Change this in production
      - DOCKER_INFLUXDB_INIT_ORG=cryptomug
      - DOCKER_INFLUXDB_INIT_BUCKET=prices
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token # Change this in production
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    ports:
      - "8086:8086"
    restart: unless-stopped

  api:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    image: cryptomug_api
    container_name: cryptomug_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_SERVER=postgres
      - POSTGRES_DB=cryptomug_db
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-token # Should match DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
      - INFLUXDB_ORG=cryptomug
      - INFLUXDB_BUCKET=prices
    depends_on:
      - postgres
      - influxdb
    restart: unless-stopped
