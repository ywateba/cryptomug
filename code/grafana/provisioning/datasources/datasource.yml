# /grafana/provisioning/datasources/datasource.yml

# The 'apiVersion' and 'datasources' keys are required by Grafana.
apiVersion: 1

# List of datasources to provision.
datasources:
  # A unique name for the datasource.
  - name: InfluxDB-Crypto
    # The type of the datasource.
    type: influxdb
    # A unique identifier for the datasource.
    uid: influxdb_crypto_uid
    # The URL to access the datasource. 'influxdb' is the service name from compose.yml.
    url: http://influxdb:8086
    # The default database for this datasource. In InfluxDB v2+, this is the bucket.
    database: 'prices'
    # The organization name.
    orgId: 'crypto-tracker'
    # Allows editing of this datasource from the Grafana UI.
    editable: true
    # Use secureJsonData to store sensitive information like tokens.
    secureJsonData:
      # The InfluxDB token.
      token: 'my-super-secret-admin-token'
    # jsonData specifies non-sensitive settings.
    jsonData:
      # The version of InfluxDB (1 for InfluxQL, 2 for Flux).
      version: 2
      # The default organization.
      defaultBucket: 'prices'
